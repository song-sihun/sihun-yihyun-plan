<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>시훈&이현</title>
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- 돌아다니는 용 마스코트 -->
    <div id="dragonMascot" class="dragon-mascot"></div>

    <div class="container">
      <header class="header">
        <div class="header-badge">SIHUN & YIHYUN</div>
        <h1>시훈 & 이현</h1>
      </header>

      <!-- TAB 1: 추억 일기장 (기본 탭) -->
      <div id="tab-diary" class="tab-content active">
        <!-- 작성 폼 열기 버튼 -->
        <button class="btn-open-form" onclick="openDiaryModal()">
          + 새 일기 작성하기 ✏️
        </button>

        <!-- 일기장 피드 카드 -->
        <div class="card">
          <h2 class="section-title">여행 추억 일기장</h2>
          <div id="diaryList"></div>
        </div>
      </div>

      <!-- TAB 2: 저축 대시보드 -->
      <div id="tab-saving" class="tab-content">
        <div class="card main-card">
          <div class="main-card-header">
            <div>
              <div style="font-size: 13px; font-weight: 700; opacity: 0.9">
                현재 저축한 금액
              </div>
              <div class="main-card-amount">
                <span id="totalSaved">0</span> 원
              </div>
            </div>
            <div class="percent-badge" id="progressPercent">0.0%</div>
          </div>
          <div class="progress-container">
            <div class="progress-track">
              <div id="progressFill" class="progress-fill"></div>
            </div>
          </div>
          <div class="stats-grid">
            <div>
              <div class="stat-label">목표 금액</div>
              <div class="stat-value"><span id="targetAmount">0</span>원</div>
            </div>
            <div>
              <div class="stat-label">남은 금액</div>
              <div class="stat-value">
                <span id="remainingAmount">0</span>원
              </div>
            </div>
            <div>
              <div class="stat-label">저축 횟수</div>
              <div class="stat-value" id="historyCount">0회</div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="section-title">
            <span>🪙 저축 기록하기</span>
            <button
              onclick="updateTargetAmount()"
              style="
                font-size: 11px;
                background: none;
                border: none;
                color: #3b82f6;
                cursor: pointer;
                font-weight: 700;
              "
            >
              [목표금액 수정]
            </button>
          </div>
          <form id="savingForm">
            <div class="form-grid">
              <div>
                <label for="savingAmount">저축 금액 (원)</label>
                <input
                  type="number"
                  id="savingAmount"
                  placeholder="예: 50000"
                  required
                />
              </div>
              <div>
                <label for="savingDate">날짜</label>
                <input type="date" id="savingDate" required />
              </div>
              <div class="form-full">
                <label for="savingNote">출처 / 요약</label>
                <input
                  type="text"
                  id="savingNote"
                  placeholder="예: 주말 알바, 용돈 이월"
                  required
                />
              </div>
              <div class="form-full">
                <button type="submit" id="savingSubmitBtn" class="btn-submit">
                  저축 기록 저금통에 넣기 🪙
                </button>
              </div>
            </div>
          </form>
        </div>

        <div class="card">
          <h2 class="section-title">📜 저축 히스토리</h2>
          <div style="overflow-x: auto">
            <table>
              <thead>
                <tr>
                  <th>회차</th>
                  <th>날짜</th>
                  <th>내용</th>
                  <th>금액</th>
                  <th style="text-align: center">삭제</th>
                </tr>
              </thead>
              <tbody id="savingHistoryList"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- 하단 네비게이션 바 -->
    <nav class="bottom-nav">
      <div class="nav-item active" onclick="switchTab('diary')">
        <span class="nav-icon">📖</span>
        <span>추억 일기장</span>
      </div>
      <div class="nav-item" onclick="switchTab('saving')">
        <span class="nav-icon">🪙</span>
        <span>저축 대시보드</span>
      </div>
    </nav>

    <!-- 일기 작성 팝업 모달 -->
    <div
      id="diaryModal"
      class="modal-overlay"
      onclick="closeDiaryModalOnOverlay(event)"
    >
      <div class="modal-card">
        <button class="modal-close" onclick="closeDiaryModal()">✕</button>
        <h2 class="section-title" style="margin-bottom: 16px">
          📖 새 추억 일기 남기기
        </h2>
        <form id="diaryForm">
          <div class="form-grid">
            <div>
              <label for="diaryDate">날짜</label>
              <input type="date" id="diaryDate" required />
            </div>
            <div>
              <label for="diaryImage">사진 첨부 (선택)</label>
              <input type="file" id="diaryImage" accept="image/*" />
            </div>
            <div class="form-full">
              <label for="diaryText">내용 / 메모</label>
              <textarea
                id="diaryText"
                placeholder="하고 싶은 일이나 오늘 이야기를 적어보세요 ❄️"
                required
              ></textarea>
            </div>
            <div class="form-full">
              <button type="submit" id="diarySubmitBtn" class="btn-submit">
                일기 저장하기 ❄️
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <!-- 이미지 크게보기 모달 -->
    <div
      id="imageModal"
      class="modal-overlay"
      onclick="this.style.display = 'none'"
    >
      <img id="modalImg" class="modal-img" src="" />
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
